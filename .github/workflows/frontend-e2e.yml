# .github/workflows/frontend-e2e-staging.yml
name: Frontend E2E (Public Domain)

on:
  workflow_run:
    workflows: ["Deploy to Staging"]
    types: [completed]

jobs:
  e2e-public:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-vue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npx playwright install --with-deps chromium

      - name: Resolve target base URL
        id: resolve_url
        run: |
          DOMAIN="${PW_BASE_URL_OVERRIDE:-https://solstoredev.duckdns.org}"
          echo "Testing DNS for $DOMAIN"
          if curl -Is --max-time 5 "$DOMAIN" >/dev/null 2>&1; then
            echo "Base URL reachable: $DOMAIN"
            echo "PW_BASE_URL=$DOMAIN" >> $GITHUB_ENV
          else
            echo "Domain unreachable, falling back to http://localhost:5173"
            echo "PW_BASE_URL=http://localhost:5173" >> $GITHUB_ENV
          fi

      - name: Run Playwright tests
        env:
          PW_BASE_URL: ${{ env.PW_BASE_URL }}
        run: npx playwright test --config=playwright.config.simple.js

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-staging
          path: front-vue/playwright-report
