name: CI - Backend 

on:
  push:
    branches: [ "develop" ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Opcional: libera espacio
      - name: Free disk on runner
        run: |
          docker system prune -af --volumes || true
          docker builder prune -af || true

      # Levanta DB + backend (sin rebuild)
      - name: Up services (database + backend)
        run: |
          docker compose up -d database backend
          sleep 10
          docker compose ps

      # Instala dependencias Composer (incluyendo dev) dentro del contenedor backend
      - name: Install Composer dependencies (with dev)
        run: |
          docker compose exec -T backend sh -lc '
            if [ ! -f vendor/autoload.php ]; then echo "Vendor missing, running composer install"; fi
            composer install --prefer-dist --no-interaction --ansi
            php --version
            composer show psr/cache | grep versions || true
          '

      - name: "Sanity check: required classes present"
        run: |
          docker compose exec -T backend sh -lc "
            php -r 'require \"vendor/autoload.php\"; echo (class_exists(\"Stripe\\\\Stripe\")?\"Stripe OK\":\"Stripe MISSING\").PHP_EOL;' && \
            php -r 'require \"vendor/autoload.php\"; echo (class_exists(\"Barryvdh\\\\DomPDF\\\\Facade\\\\Pdf\")?\"DomPDF OK\":\"DomPDF MISSING\").PHP_EOL;' && \
            php -r 'require \"vendor/autoload.php\"; echo (function_exists(\"cloudinary_url\")?\"Cloudinary helper OK\":\"Cloudinary helper MISSING\").PHP_EOL;' && \
            php -r 'require \"vendor/autoload.php\"; echo (interface_exists(\"Psr\\\\Cache\\\\CacheItemPoolInterface\")?\"psr/cache OK\":\"psr/cache MISSING\").PHP_EOL;'
          "

      # Prepara .env.testing y claves
      - name: Prepare .env.testing
        run: |
          docker compose exec -T backend bash -lc '
            [ -f .env.testing ] || cp .env.testing.example .env.testing
            php artisan key:generate --env=testing --force || true
            php artisan jwt:secret   --env=testing --force || true
            php artisan config:clear || true
            rm -f bootstrap/cache/config.php || true
          '

      # ⚠️ Fuerza SQLite en memoria para evitar datos persistentes y duplicados
      - name: Migrate & seed (SQLite in-memory)
        run: |
          docker compose exec -T \
            -e APP_ENV=testing \
            -e DB_CONNECTION=sqlite \
            -e DB_DATABASE=":memory:" \
            backend sh -lc "php artisan migrate:fresh --seed"

      - name: Run tests (SQLite in-memory)
        run: |
          docker compose exec -T \
            -e APP_ENV=testing \
            -e DB_CONNECTION=sqlite \
            -e DB_DATABASE=":memory:" \
            backend sh -lc "php artisan test"

      - name: Logs (on failure)
        if: failure()
        run: docker compose logs --tail=200
