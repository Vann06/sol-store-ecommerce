name: Deploy to Staging

on:
  push:
    branches: [ "develop" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.GCP_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to Staging
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          GCP_HOST: ${{ secrets.GCP_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=no "$SSH_USER@$GCP_HOST" 'bash -s' <<'EOSSH'
          set -e

          echo "== SSH conectado =="

          cd ~/sol-store-ecommerce

          echo "== Updating code (git pull) =="
          git pull origin develop || echo "⚠️ git pull failed, revisa repo manualmente"

          echo "== Docker up sin rebuild =="
          docker compose up -d

          echo "== Migraciones =="
          docker compose exec -T backend php artisan migrate --force || echo "⚠️ migrate falló, revisa logs"

          echo "== Limpieza de caches =="
          docker compose exec -T backend php artisan optimize:clear || true
          docker compose exec -T backend php artisan config:cache || true

          echo "== Deploy done ✅ =="
          EOSSH
